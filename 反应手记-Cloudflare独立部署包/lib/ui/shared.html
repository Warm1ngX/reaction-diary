<dialog id="accountDialog" aria-labelledby="accountTitle"><div class="dialog-head"><h2 id="accountTitle">登录你的反应手记</h2><button type="button" id="accountClose" aria-label="关闭账号窗口">×</button></div><div id="authForms"><div class="auth-tabs"><button type="button" id="loginTab" aria-pressed="true">登录</button><button type="button" id="registerTab" aria-pressed="false">注册账号</button></div><form id="authForm"><label class="field">邮箱<input id="authEmail" type="email" autocomplete="username" maxlength="254" required placeholder="you@example.com"></label><label class="field">密码<input id="authPassword" type="password" autocomplete="current-password" minlength="10" maxlength="128" required></label><label class="field" id="confirmField" hidden>再次输入密码<input id="authConfirm" type="password" autocomplete="new-password" minlength="10" maxlength="128"></label><button class="primary full" type="submit" id="authSubmit">登录</button><p class="quiet">账号独立于 ChatGPT。当前未接入邮件找回，请妥善保存密码。</p></form></div><div id="accountManage" hidden><p id="accountIdentity"></p><form id="passwordForm"><h3>修改密码</h3><label class="field">当前密码<input id="currentPassword" type="password" autocomplete="current-password" required></label><label class="field">新密码<input id="newPassword" type="password" minlength="10" maxlength="128" autocomplete="new-password" required></label><button type="submit" class="full">修改密码并退出其他设备</button></form><div class="legacy-panel" hidden><h3>迁移旧 ChatGPT 云端记录</h3><p class="quiet">验证旧账号后，只复制旧数据，保留原账号的记录。</p><a href="/signin-with-chatgpt?return_to=%2F%23legacy" target="_top" class="legacy-link">验证旧 ChatGPT 账号 ↗</a><button type="button" id="legacyImport" class="full">复制旧云端记录到当前账号</button></div></div><p id="authMessage" class="form-message" role="status" aria-live="polite"></p></dialog><div id="toast" role="status" aria-live="polite"></div>
<dialog id="recordDetailDialog" aria-labelledby="recordDetailTitle"><div class="dialog-head"><h2 id="recordDetailTitle">记录详情</h2><button type="button" id="recordDetailClose" aria-label="关闭记录详情">×</button></div><div id="recordDetailBody"></div></dialog>
